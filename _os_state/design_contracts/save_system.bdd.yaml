# save_system.bdd.yaml — 存档系统行为契约 (contra_3d)
# 供 Universal_AI_OS BDD 协议消费 (behavior_contract_protocol.md 格式)
# 系统级参考: src/core/engine/save_system.md, src/core/engine/save_system_protocol.md
# 依赖系统: 所有游戏系统 (ECS 状态序列化)

system: save_system
protocol: bdd
version: 1
source: src/core/engine/save_system.md
scenarios:
  - id: manual_save_slot_write_read
    name: 手动存档槽写入与读取
    description: 玩家选择槽位手动存档，后续可读取恢复完整游戏状态
    given:
      - 当前游戏状态: 关卡 3、位置 (120,5,80)、生命 2、得分 45000、武器 spread_shot
      - 手动存档槽 2 为空
    when:
      - SaveSystem.Save(slot=2, type="manual") 调用
      - 存档文件写入完成
      - SaveSystem.Load(slot=2) 调用
    then:
      - 存档元数据: slot_id=2, timestamp=ISO8601, playtime=当前游戏时长, current_area="level_3"
      - 游戏状态完整恢复: 位置、生命、得分、武器、库存、任务进度均一致
      - 版本号匹配当前游戏版本
      - CRC32 校验通过
    source: src/core/engine/save_system.md#多槽位
    e2e: true

  - id: autosave_on_scene_transition
    name: 场景切换触发自动存档
    description: 关卡转换时自动写入自动存档槽，覆盖上一次自动存档
    given:
      - 玩家完成关卡 2，触发场景切换至关卡 3
      - 自动存档槽 (slot=0) 已有关卡 1 的存档
    when:
      - SceneManagement.LoadScene("level_3") 触发
      - SaveSystem.AutoSave(trigger="scene_transition") 调用
    then:
      - 自动存档槽更新为关卡 3 初始状态
      - 元数据: trigger="scene_transition", current_area="level_3"
      - 旧自动存档被覆盖 (仅保留 1 个自动存档)
      - 写入采用临时文件 → 校验 → 原子替换，无损坏风险
    source: src/core/engine/save_system.md#自动存档触发条件
    e2e: true

  - id: autosave_before_boss
    name: Boss 战前自动存档
    description: 进入 Boss 房间前自动存档，保证 Boss 战失败可重试
    given:
      - 玩家到达 Boss 房入口触发区
      - 当前状态: 生命 1、得分 78000、武器 laser_rifle
    when:
      - 触发 Boss 战前检查点事件
      - SaveSystem.AutoSave(trigger="boss_entrance") 调用
    then:
      - 自动存档槽更新，包含 Boss 战前完整状态
      - 玩家死于 Boss 战后，从该存档复活 (生命恢复、位置在 Boss 门外)
      - 存档不包含 Boss 战内部状态 (Boss 血量、阶段等由战斗重置)
    source: src/core/engine/save_system.md#自动存档触发条件
    e2e: false

  - id: quick_save_load_slot
    name: 快速存档/读取槽位
    description: 快捷键触发快速存档，覆盖快速槽；快速读取恢复
    given:
      - 游戏进行中，玩家按下快速存档键 (F5)
      - 快速存档槽 (slot=-1) 为空
    when:
      - SaveSystem.QuickSave() 调用
      - 玩家随后游戏失误，按下快速读取键 (F9)
      - SaveSystem.QuickLoad() 调用
    then:
      - 快速存档槽写入当前完整状态
      - 快速读取后游戏状态与存档瞬间完全一致
      - 读取耗时 < 500ms (含反序列化 + 场景重建)
      - 快速存档不影响手动/自动存档槽
    source: src/core/engine/save_system.md#多槽位
    e2e: false

  - id: save_version_migration
    name: 存档版本迁移兼容
    description: 旧版本存档加载时自动迁移至当前版本 Schema
    given:
      - 存档文件版本 v1 (当前游戏版本 v3)
      - v1 缺少新增字段: djinn_collection, 新武器解锁标记
      - v1 有废弃字段: old_ammo_count
    when:
      - SaveSystem.Load(slot=1) 尝试加载 v1 存档
    then:
      - 版本检测到 v1 < v3，触发迁移管线
      - 新增字段填充默认值 (djinn_collection=[], weapon_unlocks={})
      - 废弃字段 old_ammo_count 被忽略不报错
      - 重命名字段 (如 position → player_position) 自动转换
      - 迁移后存档版本更新为 v3，可正常游戏
      - 原存档文件备份为 .bak 后再覆盖
    source: src/core/engine/save_system.md#版本兼容
    e2e: false

  - id: save_corruption_detection
    name: 存档损坏检测与拒绝加载
    description: CRC32 校验失败时拒绝加载并提示，不破坏现有游戏
    given:
      - 存档文件被外部修改/磁盘错误导致数据损坏
      - CRC32 校验和不匹配
    when:
      - SaveSystem.Load(slot=1) 调用
    then:
      - 校验失败，抛出 SaveCorruptedException
      - UI 显示"存档损坏，无法读取"提示
      - 当前游戏进度不受影响 (不强制重置)
      - 玩家可选择其他槽位或新游戏
    source: src/core/engine/save_system.md#安全措施
    e2e: false

  - id: atomic_write_temp_file
    name: 原子写入防止写入中断损坏
    description: 存档先写临时文件，校验通过后原子重命名覆盖
    given:
      - 存档数据准备就绪，目标文件 save_slot_1.sav
      - 磁盘空间充足
    when:
      - SaveSystem.Save(slot=1) 执行写入流程
      - 模拟写入中途断电/进程崩溃 (临时文件已写入，未重命名)
    then:
      - 临时文件名: save_slot_1.sav.tmp (或 .part)
      - 完整写入后计算 CRC32，追加至文件末尾
      - 校验通过 → 原子重命名 tmp → sav (POSIX rename / Windows MoveFileEx)
      - 崩溃时原 sav 文件完好无损，下次启动忽略残留 tmp
      - 无部分写入导致的损坏存档
    source: src/core/engine/save_system.md#安全措施
    e2e: false

  - id: checkpoint_respawn_state
    name: 检查点重生状态恢复
    description: 死亡后从最近检查点复活，保留武器/拾取进度，扣除命数
    given:
      - 最近检查点记录: 位置 (50,0,30)、生命 3、武器 rifle_default、得分 12000
      - 玩家当前: 位置 (200,0,100)、生命 1、武器 spread_shot、得分 15000
      - 玩家死亡
    when:
      - SaveSystem.RespawnFromCheckpoint() 调用
    then:
      - 玩家位置重置为检查点位置 (50,0,30) + 3m 净空偏移
      - 生命扣除 1 (3→2)，触发 3s 重生无敌
      - 武器保留当前 (spread_shot) — 魂斗罗传统：死亡不重置武器
      - 得分保留当前 (15000) — 不回退
      - 检查点后拾取的物品/击杀敌人状态重置 (需重新拾取/击杀)
    source: src/core/engine/save_system_protocol.md#存档 Schema
    e2e: true

  - id: game_over_continue_flow
    name: Game Over 续关流程
    description: 命数耗尽触发 Game Over，消耗续关次数从检查点复活
    given:
      - 玩家生命 1，无 1UP 道具
      - 续关次数剩余 2
      - 最近检查点: 关卡 2 中段
    when:
      - 玩家死亡 → 生命变 0
      - GameOver 流程启动，倒计时 10s 等待续关输入
      - 玩家确认续关
    then:
      - 续关次数 2→1
      - 生命重置为 3 (或配置值)
      - 位置回到最近检查点
      - 武器保留 (不重置为默认) — 现代模式
      - 得分保留 (不清零) — 家用版可选清零
      - 若不续关/续关用尽 → 关卡重开 (检查点清零、从关卡开始)
    source: src/core/engine/save_system.md#自动存档触发条件
    e2e: true

  - id: save_schema_template_driven
    name: 存档 Schema 由 Template 定义
    description: 游戏特定存档字段完全由 contra_3d Template 的 game_capabilities.yaml 定义
    given:
      - contra_3d 的 game_capabilities.yaml 定义 save_schema.game_state 包含:
        - weapons_unlocked: [string]
        - current_weapon: string
        - lives: int
        - score: int
        - checkpoints_reached: [string]
        - difficulty: enum
    when:
      - SaveSystem 序列化游戏状态
    then:
      - 存档 game_state 仅包含上述字段 (无多无少)
      - 通用框架字段 (header, player_state.position, event_flags) 自动补充
      - 不同游戏类型 (如 RPG) 的 game_state 结构完全不同，互不干扰
      - Schema 变更仅需修改 Template，Core 代码零改动
    source: src/core/engine/save_system_protocol.md#存档 Schema
    e2e: false