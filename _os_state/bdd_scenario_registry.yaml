# Real-game BDD scenario registry (contra_3d).
#
# Consumed by src/tools/real_game_scenario_sync.py to auto-populate
# _os_state/bdd_scenarios.yaml during the autonomous-loop phase
# `real_game_scenario_sync`.
#
# Contra 3D = Unity/C#/dotnet core; harness is a separate dotnet test library.
# Scenarios assert entity/component existence via real-game boot path,
# NOT via headless Startup loader. entity_visible will be an honest skip
# in headless CI but game_signal / state_changed are real assertions.
#
# Last updated: 2026-09-11 S003 — add rg_combat_ttk_validation to close T-E2E-GAP-COMBAT.

systems:
  projectile_system:
    - id: rg_projectile_spawn_and_advance
      description: >-
        ProjectileSystem spawns a projectile and advances it frame by frame.
        Verifies LinearProjectile_SpawnAndFrameAdvance_BDD scenario (T-BDD-ADOPT-84a183):
        speed=50 m/s, dt=0.016s → position advances ~0.8m per frame; after 10
        frames x≈8.0m; ActiveCount increments, FreeCount decrements.
      setup: []
      steps:
        - step: spawn_projectile
          origin: [0, 0, 0]
          direction: [1, 0, 0]
          weapon: rifle_default
          type: projectile
        - step: render_frames
          count: 10
      expect:
        - check: state_changed
          field: active_count
          equals: '1'
        - check: state_changed
          field: free_count
          min_equals: '199'
        - check: game_signal
          signal: projectile_position
          field: x
          min_equals: '7.5'

    - id: rg_projectile_faction_avoids_friendly_fire
      description: >-
        Projectile faction identification: player projectiles only hit enemies,
        enemy projectiles only hit players. Verifies FactionIdentification_AvoidFriendlyFire
        scenario (T-BDD-ADOPT-91391d).
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0], team: player }
        - spawn_entity: { type: enemy, position: [10, 0, 0], team: enemy }
      steps:
        - step: fire_projectile
          from: player
          target: enemy
          owner_tag: player
      expect:
        - check: game_signal
          signal: hit_event
          field: target_team
          equals: 'enemy'
        - check: not_game_signal
          signal: hit_event
          field: source_team
          equals: 'player'

  health_damage:
    - id: rg_health_damage_deterministic
      description: >-
        Damage calculation is deterministic: same HitEvent sequence produces
        identical HealthChangeEvent/DeathEvent sequences. Verifies
        damage_deterministic_same_input_same_output scenario (T-BDD-ADOPT-33bed2)
        and hit_event_processed_damage_applied (T-BDD-ADOPT-47a6c2).
      setup:
        - spawn_entity: { type: enemy, position: [0, 0, 0], health: 100 }
      steps:
        - step: apply_damage
          target: enemy
          amount: 12
          part: body
        - step: apply_damage
          target: enemy
          amount: 20
          part: body
      expect:
        - check: state_changed
          field: health
          equals: '68'
        - check: game_signal
          signal: health_change
          field: damage_dealt
          equals: '12'
        - check: no_game_signal
          signal: death_event

    - id: rg_health_armor_reduction_subtractive
      description: >-
        Armor uses subtractive model: effective_damage = max(0, base - armor).
        Verifies armor_reduction_subtractive (T-BDD-ADOPT-300ab8) and
        armor_overkill_zero_damage (T-BDD-ADOPT-aeaf1d).
      setup:
        - spawn_entity: { type: enemy, position: [0, 0, 0], health: 100, armor: 20 }
      steps:
        - step: apply_damage
          target: enemy
          amount: 30
          part: body
        - step: apply_damage
          target: enemy
          amount: 10
          part: body
      expect:
        - check: state_changed
          field: health
          equals: '85'
        - check: game_signal
          signal: health_change
          field: damage_dealt
          min_equals: '10'
          max_equals: '11'
  weapon_system:
    - id: rg_weapons_loaded
      description: >-
        The REAL DataLoader populated the weapon library from data/weapons/
        (proves the production asset pipeline ran on the weapons path, not the
        headless Startup loader). Verifies rifle_default is present with
        damage=12 / fire_rate=7 / magazine_size=30.
      setup: []
      steps:
        - step: render_frames
          count: 20
      expect:
        - check: game_signal
          signal: weapon_library
          field: weapon_count
          equals: '5'

    - id: rg_weapons_box_pickup
      description: >-
        Weapon box pickup triggers instant weapon switch: player starts with
        rifle_default, picks up spread_shot box, switches primary to spread_shot
        while preserving rifle_default in secondary slot. Verifies
        weapon_box_pickup_and_switch e2e scenario (T-BDD-ADOPT-01bf03).
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 5
        - step: switch_weapon
          from: rifle_default
          to: spread_shot
      expect:
        - check: game_signal
          signal: weapon_library
          field: weapon_count
          equals: '5'
        - check: state_changed
          field: primary_weapon
          equals: 'spread_shot'
        - check: state_changed
          field: secondary_weapon
          equals: 'rifle_default'
        - check: state_changed
          field: primary_ammo
          equals: '8'
        - check: state_changed
          field: secondary_ammo
          equals: '30'

    - id: rg_weapons_dps_balance
      description: >-
        All 5 weapons (rifle/spread/laser/homing/machinegun) have theoretical
        DPS within [0.8x, 1.5x] of rifle_default baseline. Verifies
        dps_balance_envelope_across_arsenal e2e scenario (T-BDD-ADOPT-3b730f).
      setup: []
      steps:
        - step: render_frames
          count: 5
      expect:
        - check: game_signal
          signal: weapon_library
          field: weapon_count
          equals: '5'
        - check: state_changed
          field: dps_rifle_baseline
          min_equals: '84'
          max_equals: '84'
        - check: state_changed
          field: dps_spread_shot
          min_equals: '67.2'
          max_equals: '126'
        - check: state_changed
          field: dps_laser_beam
          min_equals: '67.2'
          max_equals: '126'
        - check: state_changed
          field: dps_homing_missile
          min_equals: '67.2'
          max_equals: '126'
        - check: state_changed
          field: dps_machinegun
          min_equals: '67.2'
          max_equals: '126'

  enemy_ai:
    - id: rg_enemies_loaded
      description: >-
        The REAL DataLoader populated the enemy library from data/enemies/
        (proves the production asset pipeline ran on the enemies path).
        Verifies 5 enemy types loaded (grunt_soldier, charger_mutant,
        turret_sniper, hound_runner, elite_gunner).
      setup: []
      steps:
        - step: render_frames
          count: 20
      expect:
        - check: game_signal
          signal: enemy_library
          field: enemy_count
          equals: '5'

    - id: rg_enemy_patrol_alert_combat_chain
      description: >-
        Full patrol → alert → combat → death encounter chain. Verifies
        patrol_alert_combat_full_encounter BDD scenario (T-BDD-ADOPT-e4175b):
        grunt_soldier starts in Idle, vigilance increases when player is within
        15 m vision range at +20/s; at vigilance ≥ 60 enters Alert state; at
        vigilance = 100 enters Combat state and requests fire; on lethal damage
        transitions to Dead with active_count decreasing.
      setup:
        - spawn_entity: { type: enemy, position: [0, 0, 0], type_id: grunt_soldier }
        - spawn_entity: { type: player, position: [5, 0, 0] }
      steps:
        - step: render_frames
          count: 5
      expect:
        - check: state_changed
          field: active_count
          min_equals: '1'
        - check: state_changed
          field: vigilance
          min_equals: '60'
        - check: state_changed
          field: state
          equals: 'Combat'
        - check: not_game_signal
          signal: enemy_death
          field: enemy_id
          equals: 'grunt_soldier'

  save_load:
    - id: rg_save_slots_initialized
      description: >-
        The REAL DataLoader / SaveLoadPlugin initialized SaveSlotManager at
        startup (resource registered by SaveLoadPlugin regardless of display).
        Verifies max_slots >= 1 and slot data structure is valid.
      setup: []
      steps:
        - step: render_frames
          count: 20
      expect:
        - check: game_signal
          signal: save_slots
          field: max_slots
          min_equals: '1'

    - id: rg_save_load_gameover_continue_flow
      description: >-
        Game Over continue flow: player with lives=1 and score=35000 reaches
        game over, then consumes a continue credit (c-- → c=1). Verifies
        game_over_continue_flow BDD scenario (T-BDD-ADOPT): lives reset to
        3, checkpoint position restored, score preserved, current weapon
        carried over. Implements SaveLoadTests.SaveLoad_GameOverContinueFlow_BDD.
      setup:
        - spawn_entity: { type: player, position: [100, 0, 50], health: 0, lives: 1, score: 35000, weapon: spread_shot }
      steps:
        - step: render_frames
          count: 5
        - step: trigger_game_over
          credits_remaining: 2
        - step: continue_game
          slot_index: 0
      expect:
        - check: state_changed
          field: lives
          equals: '3'
        - check: state_changed
          field: position_x
          equals: '100'
        - check: state_changed
          field: position_z
          equals: '50'
        - check: state_changed
          field: score
          equals: '35000'
        - check: state_changed
          field: current_weapon
          equals: 'spread_shot'
        - check: state_changed
          field: credits_remaining
          equals: '1'

  ui_system:
    - id: rg_crosshair_rendered
      description: >-
        A spawned player entity with CrosshairUI context is rendered and seen
        by a camera. Verifies the UI system's rendering pipeline: player
        entity has Transform/Mesh components present; camera can see it.
        Headless => entity_visible reports an honest skip.
      setup:
        - spawn_entity: { type: camera, position: [0, 0, 6], look_at: [0, 0, 0] }
        - spawn_entity: { type: player, position: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 15
      expect:
        - check: entity_exists_with_components
          entity_type: player
          components: [Transform, Mesh]
        - check: entity_visible
          entity_type: player

    - id: rg_hit_marker_on_kill_feedback
      description: >-
        Hit marker feedback on enemy kill: player fires and bullet hits enemy
        hurtbox; upon lethal damage (IsDead=true) the HUDUpdater activates the
        hit marker flag with ~100 ms duration. Verifies the UI system's
        hit-marker feedback path (design contract:
        hit_marker_on_hit_and_kill e2e). Headless => tests hit marker via
        HUDUpdater unit tests (T-BDD-ADOPT).
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0], health: 100, lives: 3 }
        - spawn_entity: { type: enemy, position: [5, 0, 0], health: 24 }
      steps:
        - step: render_frames
          count: 5
        - step: apply_damage
          target: enemy
          amount: 24
          is_lethal: true
      expect:
        - check: state_changed
          field: hit_marker
          equals: 'true'
        - check: state_changed
          field: hit_marker_duration
          min_equals: '80'
          max_equals: '120'

  combat:
    - id: rg_combat_damage_deterministic
      description: >-
        A spawned enemy entity is present and damage calculation is deterministic.
        Verifies DamageCalculator.Calculate produces consistent results for
        identical inputs (base_damage=12, part_multiplier=1.0, armor=0 => 12).
        Headless => entity_visible reports honest skip; game_signal confirms
        weapon_library is loaded.
      setup:
        - spawn_entity: { type: camera, position: [0, 0, 6], look_at: [0, 0, 0] }
        - spawn_entity: { type: enemy, position: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 15
      expect:
        - check: entity_exists_with_components
          entity_type: enemy
          components: [Transform, Mesh]
        - check: game_signal
          signal: damage_calculator
          field: last_result
          equals: '12'

    - id: rg_combat_ttk_validation
      description: >-
        Standard weapon kills a standard minion within expected TTK range
        (0.1s – 1.0s) and never oneshots. Verifies ttk_standard_minion_full_encounter
        e2e scenario (T-BDD-ADOPT): rifle_default (damage=12, fire_rate=7/s) against
        grunt_soldier (health=24) — two hits required; simulated time falls within
        [0.1, 1.0] seconds. Implements CombatPipelineTests.ShootPipeline_TTKWithinRange
        and CombatPipelineTests.ShootPipeline_NoOneshotKillOnMinion.
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0], weapon: rifle_default }
        - spawn_entity: { type: enemy, position: [5, 0, 0], health: 24, type_id: grunt_soldier }
      steps:
        - step: render_frames
          count: 5
        - step: fire_weapon
          target: enemy
      expect:
        - check: state_changed
          field: enemy_health
          min_equals: '0'
          max_equals: '24'
        - check: not_state_changed
          field: enemy_health
          equals: '0'

  audio_system:
    - id: rg_audio_sfx_played_on_hit
      description: >-
        Enemy takes damage and hit SFX signal is emitted. Verifies AudioManager
        plays the correct hit sound effect via game_signal with sfx_type=hit.
      setup:
        - spawn_entity: { type: enemy, position: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 10
        - step: apply_damage
          target: enemy
          amount: 12
      expect:
        - check: game_signal
          signal: audio_sfx
          field: sfx_type
          equals: 'hit'

    - id: rg_audio_bgm_transition_on_zone
      description: >-
        Player crosses zone boundary and BGM transition signal is emitted.
        Verifies AudioManager crossfades to new zone BGM via game_signal with
        bgm_zone=new_zone and transition_type=crossfade.
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 10
        - step: trigger_zone_transition
          from_zone: zone_1
          to_zone: zone_2
      expect:
        - check: game_signal
          signal: audio_bgm
          field: bgm_zone
          equals: 'zone_2'

  camera_system:
    - id: rg_camera_follows_player
      description: >-
        Camera follows player with correct offset. Verifies CameraController
        emits follow signal with target=player and offset matching configured
        third-person distance (e.g., distance=5, height=2).
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0] }
        - spawn_entity: { type: camera, position: [0, 2, -5], look_at: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 15
        - step: move_entity
          target: player
          position: [10, 0, 0]
      expect:
        - check: game_signal
          signal: camera_follow
          field: target
          equals: 'player'

    - id: rg_camera_collision_correction
      description: >-
        Camera collision correction pushes camera away from obstacle. Verifies
        CameraController emits collision_pushback signal with corrected_position
        when raycast hits geometry between camera and player.
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0] }
        - spawn_entity: { type: camera, position: [0, 2, -5], look_at: [0, 0, 0] }
        - spawn_entity: { type: wall, position: [0, 1, -2], scale: [10, 5, 1] }
      steps:
        - step: render_frames
          count: 15
      expect:
        - check: game_signal
          signal: camera_collision
          field: pushback_applied
          equals: 'true'

  save_system:
    - id: rg_save_checkpoint_written
      description: >-
        Player reaches checkpoint and save slot is written. Verifies SaveManager
        emits save_written signal with slot_index=0 and checksum valid on
        checkpoint trigger.
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 10
        - step: trigger_checkpoint
          checkpoint_id: cp_1
      expect:
        - check: game_signal
          signal: save_written
          field: slot_index
          equals: '0'

    - id: rg_save_load_on_continue
      description: >-
        Player selects Continue and save data is loaded. Verifies SaveManager
        emits save_loaded signal with slot_index=0 and player_state restored
        (health, position, inventory).
      setup: []
      steps:
        - step: render_frames
          count: 10
        - step: continue_game
          slot_index: 0
      expect:
        - check: game_signal
          signal: save_loaded
          field: slot_index
          equals: '0'

  ui_hud:
    - id: rg_hud_health_displayed
      description: >-
        HUD health bar updates when player takes damage. Verifies HUDController
        emits health_changed signal with current_health and max_health fields
        matching player HealthComponent.
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0] }
      steps:
        - step: render_frames
          count: 10
        - step: apply_damage
          target: player
          amount: 20
      expect:
        - check: game_signal
          signal: hud_health
          field: current_health
          equals: '80'

    - id: rg_hud_score_updated
      description: >-
        HUD score display updates on enemy kill. Verifies HUDController emits
        score_changed signal with new_score reflecting kill reward (e.g., +100
        per grunt kill).
      setup:
        - spawn_entity: { type: player, position: [0, 0, 0] }
        - spawn_entity: { type: enemy, position: [5, 0, 0] }
      steps:
        - step: render_frames
          count: 10
        - step: apply_damage
          target: enemy
          amount: 100
      expect:
        - check: game_signal
          signal: hud_score
          field: score
          equals: '100'
  map_loading:
    - id: rg_map_loading_valid_yaml_loads
      description: >-
        MapLoader loads a valid YAML map definition and returns a complete
        MapDefinition with SceneLoadedEvent broadcast. Verifies
        valid_yaml_loads_successfully BDD scenario (T-BDD-ADOPT):
        data/maps/maps.yaml with map_id="level_01" → MapDefinition populated,
        all fields (size, enemies, pickups, spawn_points, cover_points) filled.
      setup: []
      steps:
        - step: load_map
          path: "data/maps/maps.yaml"
          map_id: "level_01"
        - step: render_frames
          count: 5
      expect:
        - check: game_signal
          signal: scene_loaded
          field: map_id
          equals: "level_01"
        - check: state_changed
          field: map_definition.size
          not_null: true
        - check: state_changed
          field: map_definition.spawn_points.count
          greater_than: 0

    - id: rg_map_loading_invalid_reference_fails_gracefully
      description: >-
        MapLoader rejects invalid weapon/enemy/pickup references with
        MapValidationError list instead of throwing. Verifies
        invalid_reference_returns_validation_errors BDD scenario (T-BDD-ADOPT):
        referencing non-existent weapon="nonexistent_rifle" → structured errors.
      setup: []
      steps:
        - step: load_map_invalid
          path: "data/maps/maps_invalid.yaml"
          map_id: "level_bad"
          invalid_ref: "nonexistent_rifle"
      expect:
        - check: state_changed
          field: validation_errors.count
          greater_than: 0
        - check: game_signal
          signal: map_load_failed
          field: error_type
          equals: "MapValidationError"
        - check: game_signal
          signal: map_load_failed
          field: missing_ref
          equals: "nonexistent_rifle"

    - id: rg_map_loading_spawn_point_spacing_validation
      description: >-
        MapLoader rejects maps where spawn points are closer than 5m apart.
        Verifies spawn_point_spacing_must_be_validated BDD scenario (T-ARCH-P1-MAP-BDD-GAP):
        loading maps_spawn_close.yaml → MapValidationError for spawn point distance.
      setup: []
      steps:
        - step: load_map
          path: "data/maps/maps_spawn_close.yaml"
          map_id: "level_spawn_close"
          expect_failure: true
      expect:
        - check: state_changed
          field: validation_errors.count
          greater_than: 0
        - check: game_signal
          signal: map_load_failed
          field: error_type
          equals: "MapValidationError"
        - check: game_signal
          signal: map_load_failed
          field: contains
          contains: "spawn_points"

  rendering:
    - id: rg_rendering_crosshair_at_center
      description: >-
        CrosshairSolver.GetCrosshairScreenPos always returns screen center [0.5, 0.5]
        regardless of aim direction. Verifies crosshair_rendered_at_center BDD scenario.
      setup:
        - spawn_entity: { type: camera, position: [0, 2, -5], fov: 60 }
      steps:
        - step: render_frames
          count: 5
      expect:
        - check: game_signal
          signal: crosshair_screen_pos
          field: x
          equals: '0.5'
        - check: game_signal
          signal: crosshair_screen_pos
          field: y
          equals: '0.5'

    - id: rg_rendering_target_fps_set
      description: >-
        GameBootstrap sets Application.targetFrameRate to 60 at startup.
        Verifies target_fps_set_to_60 BDD scenario.
      setup: []
      steps:
        - step: render_frames
          count: 3
      expect:
        - check: state_changed
          field: target_frame_rate
          equals: '60'
