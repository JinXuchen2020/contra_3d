- id: T-FIX-003
  status: completed
  completed_at: '2026-09-09T12:00:00+08:00'
  priority: P0
  title: Fix Vector3 ambiguity — qualify UnityEngine.Vector3 in PlayerController.cs
  description: |
    Unity batchmode build failed with CS0104 (Vector3 ambiguity between
    Contra3D.Core.Vector3 and UnityEngine.Vector3) and CS1704/CS0579
    (duplicate assembly/Test references).

    ROOT CAUSE: Three issues:
    1. Assembly-CSharp included Core source files (AI/, Combat/) compiled
       against pre-built Contra3D.Core.dll → type conflicts (CS0436/CS0104)
    2. Test AssemblyInfo leaked into Assembly-CSharp → CS0579 duplicate
    3. Contra3D.Runtime referenced both pre-built Core.dll AND ref DLL → CS1704

    FIX:
    - Moved Contra3D.Core.asmdef from Assets/Scripts/Core/ to Assets/Scripts/
      so Bee compiles ALL Core+AI+Combat sources into one assembly
    - Updated BuildScript.cs CleanBeeRspReferences() to strip Tests refs
      from non-test/non-Editor assemblies
    - Added GenerateAssemblyInfo=false to both Core and Test csproj
    - Qualified UnityEngine.Vector3 in PlayerController.cs lines 53,55,56
    - Deleted problematic BeeRspCleaner.cs
  result: |
    Unity batchmode build SUCCEEDS. contra_3d.exe (667KB) at Builds/Windows/.
    dotnet test: 283 PASS / 7 SKIP / 290 total. C6+C7 now PASS.
  notes: |
    Key insight: Bee was compiling AI/ and Combat/ .cs files into BOTH
    Contra3D.Core (via asmdef) AND Assembly-CSharp (via Core csproj
    Include="../AI/*.cs" and "../Combat/*.cs"). The Core source files
    referenced types from the pre-built Contra3D.Core.dll causing CS0436
    warnings and CS0104 ambiguity. Moving asmdef to Assets/Scripts/ level
    made Bee treat ALL Core+AI+Combat as one assembly, eliminating the
    duplicate compilation.
