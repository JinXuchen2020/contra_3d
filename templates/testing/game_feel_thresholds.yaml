# Game Feel Thresholds — 手感量化阈值
# 来源: shooter_scaffold.yaml defaults
metrics:
  - {metric: "accuracy", target: 0.4, lower_bound: 0.2, upper_bound: 0.7, unit: "rate"}
  - {metric: "ttk", target: 1.5, lower_bound: 0.5, upper_bound: 3.0, unit: "seconds"}
  - {metric: "kdr", target: 1.5, lower_bound: 0.5, upper_bound: 5.0, unit: "ratio"}
  - {metric: "map_traversal_time", target: 45, lower_bound: 20, upper_bound: 90, unit: "seconds"}
