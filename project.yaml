architecture_review:
  csharp:
    forbid_public_in_internal_ns: true
    forbid_source_path_divergence: true
    max_file_lines: 300
    max_monobehaviour_methods: 10
    require_asmdef_per_feature: true
    require_test_asmdef: true
    source_path_strategy: option_a_single_source
  enabled: true
  forbid_allow_dead_code_without_future: true
  forbid_back_edge_in_dependency: true
  forbid_empty_plugin_impl: true
  forbid_glob_reexport: true
  max_file_lines: 500
  max_plugins_per_file: 5
  max_pub_types_per_non_api_module: 5
  require_prelude_module: false
  coupling_threshold: 10
  type_spread_threshold: 5
  event_leak_threshold: 3
  optimization_proposal_interval: 10
asset_config:
  asset_dirs:
  - assets/models/
  - assets/textures/
  - assets/audio/music/
  - assets/audio/sfx/
  - assets/animations/
  asset_ext: glb
  battle_state_query: game_snapshot.combat.is_battling
  collider_half: 0.3
  collision_bound_x: 25.0
  format: glb
  simulation_scripts_dir: _os_state/simulation_scripts
autonomy:
  creative_expansion: false
  max_creative_cycles: 20
  max_micro_loops: 20
  max_rounds: null
  stop_on_blocked: true
  stop_on_idle: true
commands:
  asset_generation: ''
  asset_placeholder: ''
  build: E:\\programs\\unity-editor\\6000.6.0f1\\Editor\\Unity.exe -batchmode -quit -projectPath . -executeMethod BuildScript.BuildWindows
    -logFile -
  check: dotnet build Assets/contra_3d.sln -v q --nologo
  check_hardcoded: python adapter/tools/check_hardcoded.py --src-dir Assets/Scripts/
  check_source_divergence: python adapter/tools/check_source_path_divergence.py --project-root . --output _os_state/source_divergence_report.yaml
  check_warnings: python adapter/tools/check_warnings.py --build-command 'dotnet build Assets/contra_3d.sln -v q' --module-priority
    P0
  demo: ''
  metrics: python adapter/tools/collect_metrics.py --dashboard --project-root F:/AI_Projects/projects/contra_3d
  release: E:\\programs\\unity-editor\\6000.6.0f1\\Editor\\Unity.exe -batchmode -quit -projectPath . -executeMethod BuildScript.BuildWindowsRelease
    -logFile -
  run: E:\\programs\\unity-editor\\6000.6.0f1\\Editor\\Unity.exe -projectPath .
  test: E:\\programs\\unity-editor\\6000.6.0f1\\Editor\\Unity.exe -batchmode -projectPath . -runTests -testPlatform EditMode
    -testResults Results/editmode.xml -logFile -
  visual_verify: ''
  wasm: ''
data_flow: []
directories:
  assets: assets/
  data: data/
  source: Assets/Scripts/
  tests: Assets/Scripts/Core/Tests/
ecs_registry:
  components: []
  events: []
  states: []
  systems: []
env: dsh
external_loop:
  run_cmd: python ..\..\Universal-AI-OS\src\adapter\env\dsh_loop.py
framework:
  build_file: Assets/contra_3d.sln
  lock_file: ProjectSettings/ProjectVersion.txt
  name: unity
  version: 2022.3.62f3c1
  version_lock: strict
game:
  core_systems:
  - name: rendering
    status: not_started
  - name: player_movement
    status: not_started
  - name: weapon_system
    status: not_started
  - name: projectile_system
    status: not_started
  - name: enemy_ai
    status: not_started
  - name: health_damage
    status: not_started
  - name: map_loading
    status: not_started
  - name: ui_hud
    status: not_started
paths:
  project_root: E:/Freelancer/AI_Projects/projects/contra_3d
project:
  language: csharp
  name: contra_3d
  template: shooter_contra
  type: shooter
qa:
  enabled: true
  enabled_categories:
  - compilation
  - style
  - complexity
  - data
  - logic
  - test
  - documentation
  - security
  - maintainability
  - performance
  - architecture
  - architecture_consistency
  - internationalization
  - source_divergence
  severity_threshold: P1
  tool_configs:
    complexity:
      max_complexity: 15
      max_file_size: 500
    performance:
      async_loading: true
      benchmark_threshold: 2.0
    source_divergence:
      blocking: true
      check_command: python adapter/tools/check_source_path_divergence.py --project-root .
      enabled: true
      severity_threshold: P0
    test_coverage:
      min_percentage: 80
quality_gate:
  blocking_enabled: true
  blocking_priorities:
  - P0
  contract_coverage_min: 0.0
  cross_module_refs_valid_min: 1
  dead_code_max: 0
  event_closure_ratio_min: 1.0
  simulation_coverage_min: 0.0
  test_count_min: 0
release:
  artifacts:
    windows:
      output_pattern: contra_3d_{version}_windows.zip
      source: Builds/Windows/contra_3d.exe
release_platforms:
- windows
schema:
  content_types: []
  shooter_types:
  - weapon
  - enemy
  - map
  - pickup
  - boss
system_dependency_graph: {}
templates:
  base: shooter_contra
validation_protocols:
  bdd:
    blocking_priority: P1
    enabled: true
    expected_systems:
    - combat
    - weapon_system
    - enemy_ai
    - save_load
    - ui_system
    feature: os-autopilot
    min_e2e_per_system: 2
  max_draft_per_scan: 3
  playtest:
    blocking: false
    enabled: true
    expected_systems:
    - stage_traversal
    - combat_balanced
    feature: playtest-metrics
    fun_score_min: 0.6
    win_rate_min: 0.5
  runtime:
    blocking: true
    enabled: true
    thresholds:
      crash_count_max: 0
      error_count_warn: 10
      fps_min: 30
      memory_mb_max: 1024
    timeout_seconds: 120
